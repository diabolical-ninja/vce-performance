    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  (()=&gt;{
    const root=document.getElementById(&#x27;vce-searchable-compare&#x27;),q=s=&gt;root.querySelector(s),rows=JSON.parse(q(&#x27;#r-data&#x27;).textContent);
    const labels={3:&#x27;Median study score&#x27;,4:&#x27;Study scores 40+ (%)&#x27;,5:&#x27;Satisfactory VCE completion (%)&#x27;,8:&#x27;ICSEA&#x27;,9:&#x27;Tertiary applications (%)&#x27;};

    const fmt=(v,k)=&gt;v==null?&#x27;—&#x27;:k===3||k===8?v.toLocaleString(&#x27;en-AU&#x27;,{maximumFractionDigits:1}):v.toFixed(1)+&#x27;%&#x27;;
    const place=s=&gt;s.toLowerCase().replace(/\b\w/g,c=&gt;c.toUpperCase());
    function renderRankings(){
      const year=+q(&#x27;#r-year&#x27;).value,key=+q(&#x27;#r-metric&#x27;).value,n=+q(&#x27;#r-limit&#x27;).value,hasProfile=year&lt;2025;
      q(&#x27;#r-sector&#x27;).disabled=!hasProfile;q(&#x27;#r-enrolments&#x27;).disabled=!hasProfile;
      if(!hasProfile){q(&#x27;#r-sector&#x27;).value=&#x27;&#x27;;q(&#x27;#r-enrolments&#x27;).value=&#x27;0&#x27;;}
      q(&#x27;#r-profile-note&#x27;).textContent=hasProfile?&#x27;Sector and enrolment data: &#x27;+year:&#x27;Sector and enrolment filters are unavailable for 2025.&#x27;;
      const sector=q(&#x27;#r-sector&#x27;).value,min=Math.max(0,+q(&#x27;#r-enrolments&#x27;).value||0);
      const base=rows.filter(r=&gt;r[1]===year&amp;&amp;(!sector||(sector===&#x27;unknown&#x27;?!r[6]:r[6]===sector))&amp;&amp;(!min||(r[7]!=null&amp;&amp;r[7]&gt;=min)));
      const eligible=base.filter(r=&gt;r[key]!=null).sort((a,b)=&gt;b[key]-a[key]||a[0].localeCompare(b[0]));
      const cutoff=eligible[Math.min(n,eligible.length)-1]?.[key],shown=eligible.filter(r=&gt;r[key]&gt;=cutoff),secondary=key===4?3:4;
      q(&#x27;#r-title&#x27;).textContent=&#x27;Top &#x27;+n+&#x27; schools&#x27;;q(&#x27;#r-count&#x27;).textContent=eligible.length+&#x27; schools ranked · &#x27;+year;
      q(&#x27;#r-measure-label&#x27;).textContent=labels[key];q(&#x27;#r-secondary-label&#x27;).textContent=labels[secondary];

      let previous=null,rank=0;
      q(&#x27;#r-rows&#x27;).innerHTML=shown.length?shown.map((r,i)=&gt;{if(r[key]!==previous)rank=i+1;previous=r[key];return &#x27;&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;r-rank&quot;&gt;&#x27;+String(rank).padStart(2,&#x27;0&#x27;)+&#x27;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;r-school&quot; data-detail=&quot;&#x27;+i+&#x27;&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;r-detail-&#x27;+i+&#x27;&quot;&gt;&#x27;+esc(r[0])+&#x27;&lt;/button&gt;&lt;p class=&quot;v-school-detail&quot;&gt;&#x27;+esc(place(r[2]))+&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;r-result-cell&quot;&gt;&#x27;+(key===8?&#x27;&#x27;:&#x27;&lt;span class=&quot;r-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;r-bar&quot; style=&quot;width:&#x27;+Math.min(100,r[key]/(key===3?50:100)*100)+&#x27;%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&#x27;)+&#x27;&lt;span class=&quot;r-value&quot;&gt;&#x27;+fmt(r[key],key)+&#x27;&lt;/span&gt;&lt;/div&gt;&lt;/td&gt;&lt;td class=&quot;v-right r-number&quot;&gt;&#x27;+fmt(r[secondary],secondary)+&#x27;&lt;/td&gt;&lt;td class=&quot;v-right r-number&quot;&gt;&#x27;+fmt(r[5],5)+&#x27;&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;r-detail&quot; id=&quot;r-detail-&#x27;+i+&#x27;&quot; hidden&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;div class=&quot;r-detail-grid&quot;&gt;&lt;div&gt;Sector · &#x27;+year+&#x27;&lt;b&gt;&#x27;+esc(r[6]||&#x27;Unavailable&#x27;)+&#x27;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Total school enrolments · &#x27;+year+&#x27;&lt;b&gt;&#x27;+(r[7]==null?&#x27;Unavailable&#x27;:r[7].toLocaleString(&#x27;en-AU&#x27;))+&#x27;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;ICSEA · &#x27;+year+&#x27;&lt;b&gt;&#x27;+fmt(r[8],8)+&#x27;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;&#x27;;}).join(&#x27;&#x27;):&#x27;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;div class=&quot;r-empty&quot;&gt;No schools have a reported &#x27;+esc(labels[key].toLowerCase())+&#x27; for these filters.&#x27;+(year===2025       const omitted=base.length-eligible.length,ties=shown.length&gt;n?&#x27;Showing &#x27;+shown.length+&#x27; schools to include ties at the cutoff. &#x27;:&#x27;Equal scores share a rank. &#x27;;
      q(&#x27;#r-footnote&#x27;).textContent=ties+(omitted?omitted+&#x27; schools in this filtered dataset have no reported value. &#x27;:&#x27;&#x27;)+(min?&#x27;Schools with unknown enrolment are excluded by the active minimum. &#x27;:&#x27;&#x27;)+&#x27;Select a school name for its context.&#x27;;
      q(&#x27;#r-rows&#x27;).querySelectorAll(&#x27;[data-detail]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{const panel=q(&#x27;#r-detail-&#x27;+b.dataset.detail),open=panel.hidden;panel.hidden=!open;b.setAttribute(&#x27;aria-expanded&#x27;,String(open));}));
      const fallback=q(&#x27;#r-use-2024&#x27;);if(fallback)fallback.onclick=()=&gt;{q(&#x27;#r-year&#x27;).value=&#x27;2024&#x27;;renderRankings();};
    }
    [&#x27;#r-year&#x27;,&#x27;#r-metric&#x27;,&#x27;#r-sector&#x27;,&#x27;#r-limit&#x27;].forEach(s=&gt;q(s).addEventListener(&#x27;change&#x27;,renderRankings));q(&#x27;#r-enrolments&#x27;).addEventListener(&#x27;input&#x27;,renderRankings);
    root.addEventListener(&#x27;vce-rankings-open&#x27;,renderRankings);renderRankings();
  })();

    &lt;section id=&quot;v-methods&quot; class=&quot;v-methods&quot; hidden&gt;&lt;div class=&quot;v-title-row&quot;&gt;&lt;div&gt;&lt;h1&gt;Data &amp;amp; methods&lt;/h1&gt;&lt;p class=&quot;v-subtitle&quot;&gt;Understand what the figures measure and where they come from.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;Results and school profiles have different coverage&lt;/h3&gt;&lt;p&gt;The repository contains VCE results for 2014–2025. Its school profile and location fields extend through 2024. A missing value means unavailable in this dataset, and is never treated as zero.&lt;/p&gt;&lt;details open&gt;&lt;summary&gt;Median VCE study score&lt;/summary&gt;&lt;p&gt;The school’s reported median study score for that year. Study scores are out of 50. This is a school result, not an ATAR or an estimate of a school’s contribution to individual achievement.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Study scores of 40 and over&lt;/summary&gt;&lt;p&gt;The percentage of study scores that are 40 or higher. The denominator is study scores, not students. Differences between percentages are expressed in percentage points.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;School context&lt;/summary&gt;&lt;p&gt;Sector, ICSEA and total enrolments come from ACARA school profiles. Total enrolments cover the whole school. ICSEA is a measure of socio-educational context, not an academic result. Every profile value should show its year.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Missing results and source notes&lt;/summary&gt;&lt;p&gt;The existing loader merges source markers “–” and “I/D” into blank numeric values. Their separate meanings cannot be recovered from the analytical CSV alone. The future dataset should preserve those source states.&lt;/p&gt;&lt;/details&gt;&lt;p&gt;&lt;a href=&quot;https://github.com/diabolical-ninja/vce-performance&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Read the source repository&lt;/a&gt;&lt;/p&gt;&lt;/section&gt;

      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
